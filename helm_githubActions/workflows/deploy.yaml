name: Build and Deploy Spring Boot to GKE with Helm

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy with Helm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_IMAGE }}:${{ github.sha }} -f ./helm_githubActions/Dockerfile .
          docker tag ${{ secrets.DOCKER_IMAGE }}:${{ github.sha }} ${{ secrets.DOCKER_IMAGE }}:latest
          docker push ${{ secrets.DOCKER_IMAGE }}:${{ github.sha }}
          docker push ${{ secrets.DOCKER_IMAGE }}:latest

      - name: Get GKE Credentials
        run: |
          gcloud container clusters get-credentials ${{ secrets.GKE_CLUSTER_NAME }} \
            --region ${{ secrets.GCP_REGION }} \
            --project ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.12.0'

      - name: Deploy with Helm
        run: |
          helm upgrade --install springboot-app ./helm_githubActions/charts/springboot-app \
            --namespace default \
            --set image.repository=${{ secrets.DOCKER_IMAGE }} \
            --set image.tag=${{ github.sha }} \
            --wait

      - name: Verify Deployment
        run: |
          kubectl get deployment springboot-app -o wide
          kubectl get pods -l app=springboot-app
          kubectl get svc springboot-app
